<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Form</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(to right, #00c6ff, #7b2dff, #5a2de0);
}
.card{
    background:white;
    width:320px;
    padding:25px 30px;
    border-radius:8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    position:relative;
}
.card h2{
    text-align:center;
    margin-bottom:20px;
    font-weight:600;
}
.close{
    position:absolute;
    top:10px;
    right:15px;
    cursor:pointer;
    font-size:18px;
}
.input-box{
    margin-bottom:15px;
}
.input-box label{
    display:block;
    font-size:14px;
    color: #555;
    margin-bottom:5px;
}
.input-box input{
    width:100%;
    padding:10px 0;
    border:none;
    border-bottom:1px solid #ccc;
    outline:none;
}
.forgot{
    font-size:12px;
    color: #00aaff;
    margin:10px 0 20px 0;
    display:inline-block;
    text-decoration:none;
}
.btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:4px;
    background: linear-gradient(to right, #00c6ff, #7b2dff);
    color:white;
    font-weight:bold;
    cursor:pointer;
}
.signup{
    text-align:center;
    margin-top:20px;
    font-size:12px;
}
.signup a{
    color: #00aaff;
    text-decoration:none;
}
</style>
</head>
<body>

<div class="card">
    <span class="close">x</span>
    <h2>Login Form</h2>
    
    <div class="input-box">
        <label>Email or Phone</label>
        <input type="text" placeholder="">
    </div>

    <div class="input-box">
        <label>Password</label>
        <input type="password" placeholder="">
    </div>

    <a href="#" class="forgot">Forgot Password?</a>

    <button class="btn">LOGIN</button>

    <div class="signup">
        Not a member? <a href="#">Signup now</a>
    </div>
</div>

</body>
</html>
